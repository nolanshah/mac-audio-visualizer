name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-${GITHUB_SHA::7}"
          VERSION="$VERSION" ./build.sh

      - name: Package
        run: ditto -c -k --keepParent Visualizer.app Visualizer-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Visualizer-macOS
          path: Visualizer-macOS.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Visualizer-macOS.zip --title "$GITHUB_REF_NAME" --generate-notes
